apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysampleapp-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mysampleapp
  template:
    metadata:
      labels:
        app: mysampleapp
    spec:
      containers:
      - name: mysampleapp
        image: <registry-name>.azurecr.io/myimage
        ports:
        - containerPort: 80
